# values-ext.yaml
# Use when Consul runs on the local host (not inside Kubernetes).
# The consul-k8s control plane (connect-injector, dataplane sidecars, api-gateway
# controller) deploy into the kind cluster and point to the host-resident Consul
# server.  Consul HTTP API is expected at http://127.0.0.1:8500 (default, no TLS).
#
# The externalServers.hosts value is overridden at helm install time via
#   --set "externalServers.hosts[0]=${CONSUL_EXTERNAL_HOST}"
# defaulting to host.docker.internal (macOS Docker Desktop + kind).

global:
  enabled: true
  name: consul
  datacenter: dc1
  image: "docker.mirror.hashicorp.services/hashicorppreview/consul:2.1.0-dev"
  imageK8S: &consulK8sControlPlaneImage "docker.mirror.hashicorp.services/hashicorppreview/consul-k8s-control-plane:2.1.0-dev"
  imageConsulDataplane: "hashicorp/consul-dataplane:2.0.0"
  logLevel: "trace"
  tls:
    enabled: false

  acls:
    manageSystemACLs: true
    bootstrapToken:
      secretName: bootstrap-token
      secretKey: token

  enterpriseLicense:
    secretName: consul-enterprise-license
    secretKey: license
    enableLicenseAutoload: true

# No Consul server pod — server runs on the local host.
server:
  enabled: false

# No client agents — consul-dataplane sidecars connect directly to the server.
client:
  enabled: false

# Point consul-k8s components at the host-resident Consul server.
# hosts[0] is injected by run.sh via --set at helm install time.
externalServers:
  enabled: true
  hosts:
    - "host.docker.internal"
  # With global.tls.enabled=false the chart still defaults CONSUL_HTTP_PORT to 8501;
  # explicitly set httpsPort to 8500 so acl-init and other components hit the correct port.
  httpsPort: 8500
  grpcPort: 8502
  useSystemRoots: false
  # k8sAuthMethodHost: injected at helm install time via --set in run.sh
  # Must be the Kubernetes API URL reachable from the *host* (where Consul server runs),
  # not kubernetes.default.svc (only valid inside the cluster).
  k8sAuthMethodHost: "https://127.0.0.1:6443"

dns:
  enabled: true
  enableRedirection: true

connectInject:
  enabled: true
  image: *consulK8sControlPlaneImage
  logLevel: "trace"
  transparentProxy:
    defaultEnabled: true
  apiGateway:
    manageExternalCRDs: true
    manageNonStandardCRDs: true
    managedGatewayClass:
      serviceType: NodePort

# UI is served by the local Consul process; disable the in-cluster NodePort.
ui:
  enabled: false

crds:
  enableTcpRoute: true
  consulapi:
    enabled: true
