# 10-services-dc2.yaml
# Deploys the same backend services into dc2 (the failover cluster).
# api-gateway is intentionally omitted — dc2 only provides failover capacity.
# All services use the same fake-service image and configuration as dc1.
#
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  labels:
    app: service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/transparent-proxy: "true"
        consul.hashicorp.com/consul-dns: "true"
    spec:
      serviceAccountName: service-a
      containers:
        - name: service-a
          image: nicholasjackson/fake-service:v0.26.2
          env:
            - name: NAME
              value: service-a
            - name: MESSAGE
              value: "hello from service-a (dc2)"
            - name: LISTEN_ADDR
              value: "0.0.0.0:9090"
            - name: LOG_LEVEL
              value: "debug"
            - name: HTTP_CLIENT_APPEND_REQUEST
              value: "true"
          ports:
            - containerPort: 9090
