apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-a
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  labels:
    app: service-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/transparent-proxy: "true"
        consul.hashicorp.com/consul-dns: "true"
        # Consul deregistration timeout — tells consul-dataplane to deregister
        # this pod from the Consul catalog quickly on shutdown so Envoy EDS
        # is updated before the TCP port closes.  Without this, Envoy keeps
        # the endpoint as HEALTHY for ~10-30 s and sends traffic into the void.
        consul.hashicorp.com/consul-write-interval: "1s"
    spec:
      serviceAccountName: service-a
      # terminationGracePeriodSeconds must be > the time needed for:
      #   1. preStop sleep (5 s) — lets Consul deregister + EDS propagate
      #   2. in-flight request drain
      terminationGracePeriodSeconds: 15
      containers:
        - name: service-a
          image: nicholasjackson/fake-service:v0.26.2
          env:
            - name: NAME
              value: service-a
            - name: MESSAGE
              value: "hello from service-a"
            - name: LISTEN_ADDR
              value: "0.0.0.0:9090"
            - name: LOG_LEVEL
              value: "debug"
            - name: HTTP_CLIENT_APPEND_REQUEST
              value: "true"
          ports:
            - containerPort: 9090
          lifecycle:
            preStop:
              # Sleep 5 s before the app exits.  This window allows:
              #   - consul-dataplane to deregister the service in Consul
              #   - Consul to push an EDS update removing this endpoint
              #   - Envoy to receive the update and stop routing to this pod
              # Without this gap, the pod's port closes before Envoy knows
              # it is gone, causing ECONNREFUSED on in-flight requests.
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
---
