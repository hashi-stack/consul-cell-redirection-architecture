  name: service-c
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-c
  labels:
    app: service-c
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-c
  template:
    metadata:
      labels:
        app: service-c
      annotations:
        consul.hashicorp.com/connect-inject: "true"
        consul.hashicorp.com/transparent-proxy: "true"
        consul.hashicorp.com/consul-dns: "true"
    spec:
      serviceAccountName: service-c
      containers:
        - name: service-c
          image: nicholasjackson/fake-service:v0.26.2
          env:
            - name: NAME
              value: service-c
            - name: MESSAGE
              value: "hello from service-c"
            - name: LISTEN_ADDR
              value: "0.0.0.0:9090"
            - name: LOG_LEVEL
              value: "debug"
            - name: HTTP_CLIENT_APPEND_REQUEST
              value: "true"
            # service-c calls service-d2; the ServiceRouter on service-d2 then
            # routes the request to service-d1 or service-d2 based on x-cell.
            - name: UPSTREAM_URIS
              value: "http://service-d2.virtual.consul:9090"
          ports:
            - containerPort: 9090
---
