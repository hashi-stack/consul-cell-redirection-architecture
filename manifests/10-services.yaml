---
# Kubernetes Services for every mesh backend. Consul connect-inject only
# registers a pod into the mesh when a matching Service (with endpoints)
# exists; without these the connect-init container blocks on
# "Unable to find registered services" and the Deployment never becomes ready.
apiVersion: v1
kind: Service
metadata:
  name: service-a
  labels:
    app: service-a
spec:
  selector:
    app: service-a
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      protocol: TCP
---
